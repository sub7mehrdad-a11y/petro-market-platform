# استخراج و طبقه‌بندی خودکار لیست شرکت‌کنندگان نمایشگاه‌ها (scripts/exhibitor_lead_finder.py)
# — مستقل از روشن بودن سیستم کاربر.
#
# چطور کار می‌کنه:
#   - هر اجرا حداکثر تا سقف زمانی CI (کمی قبلش، با --deadline-minutes) کار می‌کنه،
#     پیشرفت رو در data/exhibition_leads/*.progress.json و *.json ذخیره و
#     commit/push می‌کنه، و اگه کامل نشده بود همون‌جا متوقف می‌شه.
#   - اجرای زمان‌بندی‌شده (هر ۳ ساعت) خودش دوباره از همون progress ادامه می‌ده تا
#     کامل بشه؛ وقتی همه چیز پردازش شد، اجراهای بعدی تقریباً آنی تموم می‌شن.
#   - فایل اکسل نهایی (یکی به‌ازای هر نمایشگاه) هم در مخزن commit می‌شه، هم
#     به‌عنوان ضمیمه‌ی این اجرا (Artifact) قابل دانلود مستقیمه — از تب Actions،
#     روی اجرای مربوطه، پایین صفحه بخش Artifacts.
#
# موتور مدل: اول کلید اختصاصی GROQ_API_KEY_EXHIBITOR کامل مصرف می‌شه (طبق
# خواسته‌ی کاربر که این کلید فقط برای همین پروژه‌ست)، و همین که به سقف سهمیه‌ی
# رایگان روزانه‌اش خورد، خودکار سوییچ به Gemini می‌کنه تا کار متوقف نشه.
#
# ۲۰۲۶-۰۹-۰۶: چون این وظیفه هر ۳ ساعت صدها درخواست به Gemini می‌زنه، ممکنه
# سهمیه‌ی رایگان روزانه‌ی کلید مشترک GEMINI_API_KEY (که بقیه‌ی ربات‌های روزانه
# هم بهش وابسته‌ن) رو تموم کنه — دقیقاً همون اتفاقی که برای Groq افتاد. اگه
# GEMINI_API_KEY_EXHIBITOR (یک کلید رایگان دیگه از aistudio.google.com، فقط
# برای همین وظیفه) رو هم اضافه کنی، اسکریپت خودش اون رو به کلید مشترک ترجیح
# می‌ده. اگه اضافه نکنی، از همون کلید مشترک استفاده می‌شه (کار می‌کنه، فقط
# ریسک اشتراک سهمیه داره).
#
# اگه همه‌ی موتورها هم‌زمان سهمیه‌شون تموم بشه، اسکریپت با کد خطا خارج می‌شه
# (به‌جای این‌که ساکت هیچ‌کاری نکنه) تا این job در تب Actions با ✗ قرمز دیده
# بشه، نه ✓ سبز گمراه‌کننده.
#
# قبل از استفاده باید:
#   1. GEMINI_API_KEY از قبل به‌عنوان Secret ثبت شده (چون بقیه‌ی ربات‌های روزانه
#      هم ازش استفاده می‌کنن) — نیازی به کار اضافه نیست.
#   2. GROQ_API_KEY_EXHIBITOR رو یک‌بار در Settings > Secrets and variables >
#      Actions اضافه کن (مقدارش همون کلید اختصاصی که برای این پروژه گرفتی).
#   3. (پیشنهادی) GEMINI_API_KEY_EXHIBITOR رو هم به همون شکل اضافه کن — یک
#      کلید رایگان جدید و جدا، فقط برای این وظیفه.
#   4. برای نمایشگاه جدید: از تب Actions با "Run workflow" آدرس/نام نمایشگاه رو
#      عوض کن، یا مقادیر پیش‌فرض زیر رو ویرایش کن.

name: Exhibitor Leads

on:
  workflow_dispatch:
    inputs:
      url:
        description: "آدرس صفحه‌ی Exhibitor List نمایشگاه"
        required: true
        default: "https://exhibitors.gulfood.com/gulfood-2026/Exhibitor"
      event_name:
        description: "نام نمایشگاه (برای نام فایل خروجی)"
        required: true
        default: "Gulfood 2026"
  schedule:
    - cron: "0 */3 * * *"   # هر ۳ ساعت، تا کامل شدن ادامه می‌ده

jobs:
  extract-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run exhibitor lead finder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_EXHIBITOR: ${{ secrets.GEMINI_API_KEY_EXHIBITOR }}
          GROQ_API_KEY_EXHIBITOR: ${{ secrets.GROQ_API_KEY_EXHIBITOR }}
          EXHIBITOR_XLSX_DIR: data/exhibition_leads/xlsx
        run: |
          python scripts/exhibitor_lead_finder.py \
            "${{ github.event.inputs.url || 'https://exhibitors.gulfood.com/gulfood-2026/Exhibitor' }}" \
            --event-name "${{ github.event.inputs.event_name || 'Gulfood 2026' }}" \
            --engine auto \
            --deadline-minutes 320

      # ۲۰۲۶-۰۹-۰۶: یک اجرا (run 16) کل کارش رو از دست داد چون بین شروع job و
      # این مرحله، یک commit دیگه (از یک نشست دیگه‌ی کاربر روی همین مخزن) به
      # main پوش شده بود و git push ساده رد شد. حالا قبل از push، تغییرات
      # جدید main rebase می‌شن؛ اگه باز هم push رد بشه (رقابت لحظه‌ای)، چند بار
      # دیگه با یک مکث کوتاه دوباره امتحان می‌شه.
      - name: Commit updated data files
        run: |
          git config user.name "exhibitor-leads-bot"
          git config user.email "actions@github.com"
          git add data/exhibition_leads/
          if git diff --quiet --cached; then
            echo "چیزی برای commit نبود."
            exit 0
          fi
          git commit -m "به‌روزرسانی لیست شرکت‌های نمایشگاهی"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            echo "push رد شد (تلاش $i) — کمی صبر و تلاش دوباره..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          echo "بعد از چند تلاش هم push نشد."
          exit 1

      - name: Upload xlsx as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exhibitor-leads-xlsx
          path: data/exhibition_leads/xlsx/*.xlsx
          retention-days: 30
