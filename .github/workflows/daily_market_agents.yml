# اجرای روزانه‌ی ایجنت‌های قیمت و اخبار بازار.
#
# چطور کار می‌کنه:
#   - گیت‌هاب هر روز ساعت 05:30 UTC (تابستان ایران ≈ 09:00) این دو اسکریپت رو اجرا می‌کنه.
#   - نتایج (data/price_history.json و data/news_analysis_log.json) رو خودش commit و push می‌کنه.
#   - سایت مستقیم از همین فایل‌های JSON (پوشه‌ی data/) می‌خونه.
#
# قبل از استفاده باید:
#   1. کلید رایگان GEMINI_API_KEY (از aistudio.google.com، بدون کارت اعتباری) رو
#      در Settings > Secrets and variables > Actions ثبت کنی.
#   2. از تب Actions می‌تونی با "Run workflow" (workflow_dispatch) دستی تستش کنی.

name: Daily Market Agents

on:
  schedule:
    - cron: "30 5 * * *"   # هر روز، 05:30 UTC
  workflow_dispatch: {}     # اجرای دستی برای تست

jobs:
  run-agents:
    runs-on: ubuntu-latest
    # سقف کل job: قبلاً یک ربات گیرکرده تا ۶ ساعت می‌موند و کل job cancel می‌شد.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # continue-on-error روی همه‌ی ربات‌ها: قبلاً اگر یک ربات خطا می‌داد، کل job
      # fail می‌شد و مرحله‌ی commit اجرا نمی‌شد — یعنی داده‌ی سالم بقیه‌ی ربات‌ها هم
      # همان روز از دست می‌رفت. حالا هر ربات مستقل است و هرچه جمع شد commit می‌شود.
      - name: Run price intelligence bot
        continue-on-error: true
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_agent.py price scripts/price_intelligence_bot.py

      - name: Run news analysis bot
        continue-on-error: true
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_agent.py news scripts/news_analysis_bot.py

      - name: Run Turkey competitor watch bot
        continue-on-error: true
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_agent.py turkey scripts/turkey_watch_bot.py

      - name: Run China competitor watch bot
        continue-on-error: true
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_agent.py china scripts/china_watch_bot.py

      - name: Run transit/freight rate watch bot
        continue-on-error: true
        timeout-minutes: 40
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/run_agent.py transit scripts/transit_watch_bot.py

      # «مغز پلتفرم»: بعد از ربات‌های بالا، همه‌ی داده‌ها دوباره خوانده و امتیاز کشورها + خلاصه‌ی جامع ساخته می‌شود
      # (بدون مدل هوش مصنوعی؛ همیشه می‌شود اجرایش کرد). فقط داده‌ی عمومی — داده‌ی فروش هرگز در مخزن نیست.
      - name: Build platform brain digest and country scores
        if: always()
        continue-on-error: true
        run: python scripts/build_brain.py

      # «توصیه‌ی هفته»: فقط با کلید اختصاصی GEMINI_API_KEY_BRAIN (سهمیه‌ی جدا از ربات‌های بالا) و حداکثر هفته‌ای
      # یک‌بار (اسکریپت خودش اگر کمتر از ۶ روز گذشته باشد رد می‌شود). بدون کلید، بی‌سروصدا رد می‌شود.
      - name: Generate weekly brain briefing
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY_BRAIN: ${{ secrets.GEMINI_API_KEY_BRAIN }}
        run: python scripts/brain_briefing.py

      # always(): حتی اگه یک استپ بالا گیر کرد/cancel شد، داده‌ی ربات‌های سالم commit بشه.
      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/agent_status.json data/price_history.json data/news_analysis_log.json data/turkey_watch_log.json data/china_watch_log.json data/transit_log.json data/brain/digest.md data/brain/country_scores.json data/brain/radar.json data/brain/briefing.json
          git diff --quiet --cached || git commit -m "به‌روزرسانی داده‌های روزانه‌ی بازار"
          git pull --rebase --autostash
          git push
