<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><title>نقشه‌ی تولیدکنندگان بی‌کربنات سدیم روسیه، بنادر و مسیرهای حمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2a2f; --ink2:#51616a; --line:#d9dfdc;
  --sea:#dcebf1; --land:#f1ede3; --home:#e7dfc9; --coast:#9fb3b9; --border:#b9b29c;
  --factory:#a63a20; --port:#0b6e8a; --border-c:#c07a0a; --market:#5a3b86;
  --road:#a63a20; --chip:#eef1ee; --chip-on:#1d2a2f; --chip-on-ink:#ffffff;
  --warn-bg:#fbf1dc; --warn-ink:#6a4a06; --label-halo:#f4f5f2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181b; --panel:#1a2226; --ink:#e6ecea; --ink2:#9fb0b6; --line:#2c383d;
    --sea:#14232b; --land:#232b2c; --home:#2d3430; --coast:#456069; --border:#4a5654;
    --factory:#ef7a55; --port:#4fc0de; --border-c:#e9a43a; --market:#b79af0;
    --road:#ef7a55; --chip:#222d32; --chip-on:#e6ecea; --chip-on-ink:#12181b;
    --warn-bg:#352d18; --warn-ink:#ecd49a; --label-halo:#14232b;
  }
}
:root[data-theme="dark"]{
  --bg:#12181b; --panel:#1a2226; --ink:#e6ecea; --ink2:#9fb0b6; --line:#2c383d;
  --sea:#14232b; --land:#232b2c; --home:#2d3430; --coast:#456069; --border:#4a5654;
  --factory:#ef7a55; --port:#4fc0de; --border-c:#e9a43a; --market:#b79af0;
  --road:#ef7a55; --chip:#222d32; --chip-on:#e6ecea; --chip-on-ink:#12181b;
  --warn-bg:#352d18; --warn-ink:#ecd49a; --label-halo:#14232b;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);direction:rtl;font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;font-size:14px;line-height:1.7;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:1280px;margin-inline:auto}
header h1{font-size:20px;margin:0 0 2px;font-weight:700;text-wrap:balance}
header p{margin:0;color:var(--ink2);font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:8px 22px;margin:12px 0 4px;padding:10px 0;border-block:1px solid var(--line)}
.kpi{display:flex;flex-direction:column;min-width:96px}
.kpi b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi-note{font-size:12px;color:var(--ink2);margin:4px 0 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip:focus-visible,.btn:focus-visible,.row:focus-visible,summary:focus-visible,.fbtn:focus-visible{outline:2px solid var(--port);outline-offset:2px}
.sw{width:11px;height:11px;display:inline-block}
.sw.f{background:var(--factory)} .sw.p{background:var(--port);border-radius:50%} .sw.b{background:var(--border-c);transform:rotate(45deg)} .sw.m{background:var(--market);border-radius:50%}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:1px solid var(--line);background:var(--sea);border-radius:6px;overflow:hidden}
#map{display:block;width:100%;height:auto;max-height:86vh;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.zoombar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-block-end:1px solid var(--line)}
.btn{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;font:inherit;font-size:17px;cursor:pointer;line-height:1}
.btn.wide{width:auto;padding:0 10px;font-size:12px;height:34px}
.hint{position:absolute;inset-block-end:8px;inset-inline-start:10px;font-size:11px;color:var(--ink2);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:2px 8px;border-radius:4px}
.tip{position:fixed;z-index:20;pointer-events:none;max-width:290px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:6px;padding:7px 10px;font-size:12.5px;line-height:1.6;display:none}
.tip b{font-weight:700}
.tip .sub{color:var(--ink2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;max-height:86vh;overflow:auto}
.panel h2{font-size:16px;margin:0 0 2px;font-weight:700}
.panel .co{color:var(--ink2);font-size:12.5px;margin:0 0 8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 10px;font-size:13px}
.facts dt{color:var(--ink2)} .facts dd{margin:0}
.q{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink2);margin-inline-start:4px}
.fl{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px}
.fbtn{display:flex;justify-content:space-between;gap:8px;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:6px 2px;cursor:pointer}
.fbtn:hover{background:var(--chip)} .fbtn small{color:var(--ink2)}
.fbtn.on{font-weight:700;background:var(--chip)}
.grp{font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 3px;display:flex;align-items:center;gap:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 6px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink2);font-size:12px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer} tr.row:hover,tr.row.on{background:var(--chip)}
.mode{font-size:12px;color:var(--ink2)}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:5px;padding:7px 10px;font-size:12.5px;margin:10px 0}
section.below{margin-top:22px}
section.below h3{font-size:15px;margin:0 0 6px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.scroll table{min-width:880px}
details{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 12px;margin-top:12px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 2px;padding-inline-start:20px} details li{margin-bottom:6px}
a{color:var(--port)}
/* svg */
.land{fill:var(--land);stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke}
.land.home{fill:var(--home);stroke:var(--coast);stroke-width:1}
.arc{fill:none;stroke-width:1.1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.55}
.road{fill:none;stroke:var(--road);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.hit{fill:none;stroke:transparent;stroke-width:14;vector-effect:non-scaling-stroke;cursor:pointer}
.arc.hl,.road.hl{stroke-width:3.6;opacity:1}
.lbl{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--label-halo);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;direction:ltr}
.lbl.geo{font-size:12px;fill:var(--ink2);font-weight:500;opacity:.8}
.lbl.sea{font-style:italic;fill:var(--coast);font-size:13px;opacity:.95}
.mk{cursor:pointer}
.mk.dim{opacity:.62}
@media (prefers-reduced-motion:no-preference){.mk circle,.mk rect,.mk path{transition:transform .12s}}
</style>

<div class="wrap">
<header>
  <h1 id="h1"></h1>
  <p id="sub"></p>
</header>

<div class="kpis" id="kpis" aria-label="شاخص‌های کل کشور"></div>
<p class="kpi-note" id="kpinote"></p>

<div class="toolbar" role="group" aria-label="لایه‌ها">
  <button class="chip" id="t-factory" aria-pressed="true"><span class="sw f"></span>کارخانه‌ها</button>
  <button class="chip" id="t-port" aria-pressed="true"><span class="sw p"></span>بنادر</button>
  <button class="chip" id="t-border" aria-pressed="true"><span class="sw b"></span><span id="bl-chip">مرزهای زمینی</span></button>
  <button class="chip" id="t-market" aria-pressed="true"><span class="sw m"></span>مراکز مصرف</button>
</div>

<div class="main">
  <div class="mapbox">
    <div class="zoombar" id="zoombar">
      <button class="btn" id="z-in" aria-label="بزرگ‌نمایی">+</button>
      <button class="btn" id="z-out" aria-label="کوچک‌نمایی">−</button>
    </div>
    <svg id="map" role="img"></svg>
    <div class="hint">چرخ موس یا دو انگشت: بزرگ‌نمایی · کشیدن: جابه‌جایی</div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<div class="tip" id="tip"></div>

<section class="below">
  <h3>ماتریس فاصله‌ی جاده‌ای کارخانه‌ها (کیلومتر)</h3>
  <div class="scroll"><table id="matrix"></table></div>
</section>

<details open>
  <summary>روش، منابع و محدودیت‌های داده</summary>
  <ul id="notes"></ul>
</details>
</div>

const META={"key":"russia","title":"نقشه‌ی تولیدکنندگان بی‌کربنات سدیم روسیه، بنادر و مسیرهای حمل","subtitle":"پروفایل رقابتی روسیه. روی کارخانه کلیک کنید تا فاصله‌ی جاده‌ای آن تا بنادر، مرزهای زمینی و مراکز مصرف دیده شود؛ با نگه‌داشتن موس روی هر نشانگر یا مسیر، جزئیات نمایش داده می‌شود.","kpis":[["۱۹۳٫۹ هزار تن","تولید و فروش بی‌کربنات BSK در ۲۰۲۴"],["۲۰۰ هزار تن","ظرفیت اعلام‌شده‌ی BSK (۲۰۲۲)"],["بیش از ۴۰٪","سهم صادرات در ۲۰۲۴"],["۱۵۷ هزار تن","تولید ۲۰۱۹ (برای مقایسه)"],["۸۴٪","سهم BSK از بازار روسیه (برآورد ۲۰۱۸)"]],"kpiNote":"منابع: اینترفکس (۱۹ مارس ۲۰۲۵؛ ۲۰۲۰)، آگهی خبری BSK (اکتبر ۲۰۲۲)، ریا نووستی (۲۰۱۸). تنها یک واحد تأییدشده؛ ظرفیت ملی بی‌کربنات در منابع یافت‌شده نبود.","bbox":[27,40,122,66],"home":[27,41,70,62],"presets":[["اورال و ولگا",[44,50,66,58]],["خزر و قفقاز",[40,40,56,49]],["سیبری تا مرز چین",[60,48,122,60]]],"seas":[["دریای خزر",51,41.8],["دریای سیاه",33.5,43.4],["خلیج فنلاند",27.9,59.9]],"gl_override":{"Russia":[48,62]},"defaultFactory":"sterlitamak","notes":["<b>ظرفیت بی‌کربنات سدیم (NaHCO₃، سودای خوراکی):<\/b> در روسیه تنها یک واحد تولید بی‌کربنات سدیم با منبع معتبر تأیید شد: کارگاه سودای خوراکی شرکت سودای باشقیر (BSK) در استرلیتاماک. بر پایه‌ی آگهی خبری خود شرکت (اکتبر ۲۰۲۲)، «ظرفیت تولید و بسته‌بندی» به ۲۰۰ هزار تن در سال رسیده و هدف توسعه تا ۳۵۰ هزار تن در سال بیان شده است (<a href=\"https://ufa.plus.rbc.ru/pressrelease/633d11657a8aa99dfeb7f669\" target=_blank rel=noopener>آگهی خبری BSK<\/a>). منبع به تن در سال است و تبدیل واحدی انجام نشد. چون این عدد از یک بیانیه‌ی مطبوعاتی است و نه گزارش حسابرسی‌شده، درجه‌ی «الف−» (سخن رسمی شرکت از طریق رسانه‌ی ثالث) به آن داده شد.","<b>تولید واقعی:<\/b> ۱۵۷ هزار تن سودای خوراکی در ۲۰۱۹ (<a href=\"https://www.interfax.ru/russia/725327\" target=_blank rel=noopener>اینترفکس، ۲۰۲۰<\/a>)؛ ۱۹۳٫۹ هزار تن بی‌کربنات در ۲۰۲۴ با رشد ۲۰٪ نسبت به ۲۰۲۳ و صادرات بیش از ۴۰٪ به کشورهای همسایه‌ی روسیه، آمریکای لاتین، جنوب آسیا و خاورمیانه (<a href=\"https://www.interfax.ru/business/1015375\" target=_blank rel=noopener>اینترفکس، ۱۹ مارس ۲۰۲۵<\/a>). رقم تولید ۲۰۲۵ برای بی‌کربنات به‌تنهایی یافت نشد؛ اینترفکس (ژوئیه ۲۰۲۶) فقط کاهش تولید سودا و بی‌کربنات در ۲۰۲۵ را به افت صادرات خارج از جامعه‌ی کشورهای مستقل مشترک‌المنافع نسبت داده و بهره‌برداری کل ظرفیت شرکت را ۸۳٫۳٪ (در برابر ۹۲٫۹٪ در ۲۰۲۴) گزارش کرده است (<a href=\"https://interfax.com/newsroom/top-stories/118290/\" target=_blank rel=noopener>اینترفکس، ۲ ژوئیه ۲۰۲۶<\/a>).","<b>بررسی سازگاری:<\/b> (الف) نوشته‌ی «اسپارک» تولید سودای خوراکی کارخانه را ۲۱۷ هزار تن می‌نویسد (<a href=\"https://spark.ru/user/253165/blog/250454/yubilej-zavoda-soda-80-let-innovatsij-i-ekologicheskih-initsiativ-bashkirskoj-sodovoj-kompanii\" target=_blank rel=noopener>spark.ru<\/a>)، در حالی که اینترفکس ۱۹۳٫۹ هزار تن آورده است؛ هر دو سال را به‌صراحت ۲۰۲۴ نمی‌گویند و تفاوت توضیح داده نشده است. (ب) عدد ۲۱۷ هزار تن از ظرفیت ۲۰۰ هزار تنی (۲۰۲۲) بیشتر است؛ یعنی یا ظرفیت از ۲۰۲۲ افزایش یافته، یا ۲۱۷ هزار تن شامل فراورده‌ی دیگری است. به همین دلیل ظرفیت «الف−» و احتمالاً کهنه تلقی می‌شود. (ج) سهم ۸۴٪ BSK از بازار بی‌کربنات روسیه برآورد منبع شرکت در ۲۰۱۸ است (<a href=\"https://finance.rambler.ru/other/40452738-eksperty-rasskazali-o-posledstviyah-zakrytiya-sodovogo-zavoda-v-bashkirii/\" target=_blank rel=noopener>ریا نووستی، ۲۰۱۸<\/a>) و با داده‌ی مستقل تأیید نشد.","<b>کارخانه‌هایی که در نقشه نیامدند:<\/b> کارخانه‌ی سودای برزنیکی (Berezniki Soda Plant، استان پرم) وابسته به همان گروه است، اما همه‌ی منابع یافت‌شده آن را فقط تولیدکننده‌ی سودای کلسینه (سودا اش، Na₂CO₃) معرفی می‌کنند — ظرفیت ۶۵۰ هزار تن در سال سودای کلسینه (<a href=\"https://regions.kp.ru/perm/bereznikovskii-sodovyi-zavod/\" target=_blank rel=noopener>کامسومولسکایا پراودا<\/a>)، (<a href=\"https://www.bsz.ru/\" target=_blank rel=noopener>وب‌گاه کارخانه<\/a>) و (<a href=\"https://www.interfax.ru/russia/1018194\" target=_blank rel=noopener>اینترفکس، ۲۰۲۵<\/a>) — و تولید بی‌کربنات در آن تأیید نشد؛ بنابراین نشانه‌گذاری نشد. کارخانه‌ی سودای کریمه (Krymsky Soda) در شبه‌جزیره‌ی کریمه نیز به‌دلیل وضعیت سرزمینی مورد مناقشه و نبود شاهد بر تولید بی‌کربنات در نقشه نیامده است. تولیدکننده‌ی دیگری با منبع معتبر یافت نشد؛ اما نبود شاهد به معنای نبود تولید نیست.","<b>مختصات:<\/b> کارخانه با مختصات مرکز شهر استرلیتاماک (<a href=\"https://en.wikipedia.org/wiki/Sterlitamak\" target=_blank rel=noopener>ویکی‌پدیا<\/a>) گذاشته شده و درجه‌ی «ب» دارد؛ محل دقیق کارخانه احراز نشد و تا چند کیلومتر تفاوت دارد. مختصات زابایکالسک (<a href=\"https://en.wikipedia.org/wiki/Zabaykalsk\" target=_blank rel=noopener>ویکی‌پدیا<\/a>) و کیاختا (<a href=\"https://en.wikipedia.org/wiki/Kyakhta\" target=_blank rel=noopener>ویکی‌پدیا<\/a>) از ویکی‌پدیا، مختصات بنادر و شهرها از مختصات عمومی شناخته‌شده است. نقطه‌ی ساگارچین و ورخنی لارس از تقاطع مسیر جاده‌ای سرور مسیریابی با مرز لایه‌ی نقشه (Natural Earth) محاسبه شد و خطای آن حدود چند کیلومتر است؛ نقطه‌ی سامور تقریبی (تا حدود ۱۰ کیلومتر) است.","<b>روش فاصله‌ها:<\/b> فاصله‌ها «فاصله‌ی جاده‌ای» به متر از سرور عمومی OSRM (موتور مسیریابی متن‌باز؛ <a href=\"https://project-osrm.org/\" target=_blank rel=noopener>project-osrm.org<\/a>) با نمایه‌ی خودرو است. شکل مسیرهای ترسیم‌شده ساده‌شده است و طول آن‌ها کمی کوتاه‌تر از طول جدول است. برای هفت مقصد (آستراخان، ماخاچ‌قلعه، ورخنی لارس، سامور، نووسیبیرسک، زابایکالسک و کیاختا) کوتاه‌ترین مسیر خام OSRM از خاک قزاقستان می‌گذرد؛ برای نمایش مسیر درون خاک روسیه، مسیر با نقاط میانی (سامارا–ساراتوف–ولگوگراد یا یکاترینبورگ–تیومن–اومسک) محاسبه شد و فاصله‌ی همان مسیر ثبت شد (مثلاً آستراخان ۱٬۷۲۰ کیلومتر در برابر ۱٬۳۰۳ کیلومتر مسیر کوتاه‌تر از قزاقستان). مقایسه‌ی کامل در فایل sources.md آمده است.","<b>مرزها و ملاحظات سیاسی:<\/b> مرزهای نقشه خطوط واقعیِ (de facto) مجموعه‌داده‌ی عمومی Natural Earth هستند و موضعی سیاسی بیان نمی‌کنند. هیچ نقطه‌ای در کریمه یا مناطق مورد مناقشه نیامده است. بنادر خاور دور (ولادی‌وستوک و وستوچنی) حذف شدند، زیرا مسیر خام OSRM از قزاقستان و چین می‌گذشت و فاصله‌ی «درون روسیه» قابل اتکا به‌دست نیامد. گذرگاه‌های مرز غربی (اتحادیه‌ی اروپا و بلاروس) بررسی نشدند.","<b>آنچه اندازه‌گیری نشده است:<\/b> حمل ریلی (شیوه‌ی اصلی حمل بار در روسیه؛ فقط فاصله‌ی جاده‌ای قابل اندازه‌گیری بود)، نرخ کرایه، زمان توقف در گذرگاه‌ها و بنادر، تحریم‌ها و محدودیت پرداخت، مجوزهای ترانزیت از قزاقستان، حمل دریایی از آستراخان و ماخاچ‌قلعه به ایران، و ظرفیت‌های سودای کلسینه. تصریح می‌شود که انفجار گاز اوت ۲۰۲۵ در مجتمع «کاوستیک» همین شرکت مربوط به واحد پی‌وی‌سی (پلی‌وینیل کلرید) بوده و در منابع یافت‌شده به کارگاه بی‌کربنات ربط داده نشده است (<a href=\"https://ukranews.com/news/1098807-pogasili-sodu-na-krupnejshem-v-rf-predpriyatii-po-proizvodstvu-gidrokarbonata-natriya-proizoshel\" target=_blank rel=noopener>اوکراین‌نیوز<\/a>). خروج شرکت از فهرست شرکت‌های راهبردی در مارس ۲۰۲۵ نیز در منابع به ظرفیت بی‌کربنات ربط داده نشده است (<a href=\"https://www.interfax.ru/russia/1011730\" target=_blank rel=noopener>اینترفکس<\/a>). ریسک مواد اولیه: ذخیره‌ی سنگ‌آهک معدن شاختاو (Shakhtau) در ۲۰۲۰ تا حدود ۲۰۲۷ کافی برآورد شد (<a href=\"https://www.interfax.ru/russia/725327\" target=_blank rel=noopener>اینترفکس<\/a>)."],"bboxEff":[27,33.294,122,69.185],"H":520,"homeName":"Russia"};
const W=800, H=META.H;
const fa=n=>Number(n).toLocaleString('fa-IR');
const km=m=>Math.round(m/1000);
const BFA=META.borderFa||'مرز زمینی', BGR=META.borderGroup||'مرزهای زمینی';
const TYPE={port:{fa:'بندر',cls:'p',grp:'بنادر'},border:{fa:BFA,cls:'b',grp:BGR},market:{fa:'مرکز مصرف',cls:'m',grp:'مراکز مصرف'}};
const COL={port:'var(--port)',border:'var(--border-c)',market:'var(--market)'};
const F=DATA.F, D=DATA.D, dist=DATA.dist, roads=DATA.roads;
const Fid=Object.fromEntries(F.map(f=>[f.id,f])), Did=Object.fromEntries(D.map(d=>[d.id,d]));
const layers={factory:true,port:true,border:true,market:true};
let sel=META.defaultFactory||F[0].id, hoverDest=null, T=d3.zoomIdentity;

// ---------- header ----------

document.getElementById('kpis').innerHTML=META.kpis.map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('');
document.getElementById('kpinote').textContent=META.kpiNote||'';
document.getElementById('bl-chip').textContent=BGR;

const svg=d3.select('#map').attr('viewBox',`0 0 ${W} ${H}`).attr('aria-label','نقشه‌ی تعاملی: '+META.title);
const [bx0,by0,bx1,by1]=META.bboxEff;
const proj=d3.geoMercator().fitExtent([[0,0],[W,H]],{type:'MultiPoint',coordinates:[[bx0,by0],[bx1,by0],[bx1,by1],[bx0,by1]]});
const path=d3.geoPath(proj);
const gGeo=svg.append('g');
const gMark=svg.append('g');
const gLab=svg.append('g');

// land
gGeo.selectAll('path.land').data(GEO.features).join('path')
  .attr('class',d=>d.properties.n===META.homeName?'land home':'land').attr('d',path);

// geographic labels (screen space; placed with collision avoidance)
const GL=[];
GEO.features.forEach(f=>{
  const ov=(META.gl_override||{})[f.properties.n];
  const fa_=f.properties.fa;
  const ovNum=ov&&typeof ov[0]==='number';
  const c=ov?(ovNum?ov:ov.slice(1)):f.properties.c;
  const txt=(ov&&!ovNum)?ov[0]:fa_;
  if(txt&&c) GL.push({t:txt,lon:c[0],lat:c[1],cls:'geo',xy:proj(c)});
});
(META.seas||[]).forEach(s=>GL.push({t:s[0],lon:s[1],lat:s[2],cls:'sea',xy:proj([s[1],s[2]])}));
GL.forEach(g=>{g.el=gLab.append('text').attr('class','lbl '+g.cls).attr('text-anchor','middle').text(g.t);});

// routes layer (inside zoomed group, non-scaling strokes)
const gRoute=gGeo.append('g');

// markers
const mk=[];
function addMarker(o,kind){
  const g=gMark.append('g').attr('class','mk').attr('tabindex',0).attr('role','button').attr('aria-label',o.n||o.name);
  if(kind==='factory'){ g.append('rect').attr('x',-7).attr('y',-7).attr('width',14).attr('height',14).attr('fill','var(--factory)').attr('stroke','var(--panel)').attr('stroke-width',2); }
  else if(kind==='port'){ g.append('circle').attr('r',5.5).attr('fill','var(--port)').attr('stroke','var(--panel)').attr('stroke-width',1.6); }
  else if(kind==='border'){ g.append('rect').attr('x',-5.5).attr('y',-5.5).attr('width',11).attr('height',11).attr('transform','rotate(45)').attr('fill','var(--border-c)').attr('stroke','var(--panel)').attr('stroke-width',1.6); }
  else { g.append('circle').attr('r',6).attr('fill','var(--market)').attr('stroke','var(--panel)').attr('stroke-width',1.6); }
  const t=gLab.append('text').attr('class','lbl').text(o.short||o.n);
  const m={o,kind,g,t,xy:proj([o.lon,o.lat]),w:0};
  mk.push(m);
  return m;
}
F.forEach(f=>addMarker(f,'factory'));
D.forEach(d=>addMarker(d,d.t));

// tooltip
const tip=document.getElementById('tip');
function showTip(html,ev){tip.innerHTML=html;tip.style.display='block';moveTip(ev)}
function moveTip(ev){
  const pad=14,w=tip.offsetWidth,h=tip.offsetHeight;
  let x=ev.clientX-w-pad, y=ev.clientY+pad;
  if(x<8) x=ev.clientX+pad;
  if(y+h>innerHeight-8) y=ev.clientY-h-pad;
  tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';
}
function hideTip(){tip.style.display='none'}
function factoryTip(f){
  return `<b>${f.name}</b><div class="sub">${f.co} · ${f.loc}</div><div>${f.cap}</div><div class="sub">درجه‌ی اعتبار ظرفیت: ${f.capq}</div>`;
}
function destTip(d){
  let h=`<b>${d.n}</b><div class="sub">${TYPE[d.t].fa}</div>`;
  if(d.role) h+=`<div>${d.role}</div>`;
  const dm=dist[sel][d.id];
  h+=`<div>فاصله از «${Fid[sel].short}»: <b>${fa(km(dm))} کیلومتر</b> (جاده)</div>`;
  return h;
}
mk.forEach(m=>{
  m.g.on('mouseenter',ev=>{ if(m.kind==='factory') showTip(factoryTip(m.o),ev); else showTip(destTip(m.o),ev); if(m.kind!=='factory'){hoverDest=m.o.id;drawRoutes();place();} })
     .on('mousemove',moveTip)
     .on('mouseleave',()=>{hideTip(); if(m.kind!=='factory'){hoverDest=null;drawRoutes();place();}})
     .on('click',()=>{ if(m.kind==='factory'){sel=m.o.id;render();} else {hoverDest=m.o.id;drawRoutes();place();} })
     .on('keydown',ev=>{ if((ev.key==='Enter'||ev.key===' ')&&m.kind==='factory'){ev.preventDefault();sel=m.o.id;render();} });
});

// geometry helpers
function arcPath(a,b){
  const p=proj(a), q=proj(b);
  const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2;
  const dx=q[0]-p[0], dy=q[1]-p[1], len=Math.hypot(dx,dy)||1;
  const off=Math.min(60,len*0.14);
  const cx=mx-dy/len*off, cy=my+dx/len*off;
  return `M${p[0]},${p[1]}Q${cx},${cy} ${q[0]},${q[1]}`;
}
function drawRoutes(){
  gRoute.selectAll('*').remove();
  const f=Fid[sel];
  D.forEach(d=>{
    if(!layers[d.t]) return;
    const hl=(hoverDest===d.id);
    const key=sel+'|'+d.id;
    const km_=km(dist[sel][d.id]);
    const tipHtml=ev=>showTip(`<b>${f.short} تا ${d.n}</b><div>طول مسیر جاده‌ای: <b>${fa(km_)} کیلومتر</b></div><div class="sub">${roads[key]?'هندسه‌ی واقعی مسیر (OpenStreetMap)':'خط مستقیم شماتیک؛ طول از مسیریاب جاده‌ای'}</div>`,ev);
    if(roads[key]){
      const coords=roads[key].map(c=>proj(c));
      const dstr='M'+coords.map(c=>c.join(',')).join('L');
      gRoute.append('path').attr('class','road'+(hl?' hl':'')).attr('d',dstr).style('stroke',COL[d.t]);
      gRoute.append('path').attr('class','hit').attr('d',dstr).on('mousemove',ev=>tipHtml(ev)).on('mouseleave',hideTip);
    } else {
      const dstr=arcPath([f.lon,f.lat],[d.lon,d.lat]);
      gRoute.append('path').attr('class','arc'+(hl?' hl':'')).attr('d',dstr).style('stroke',COL[d.t]);
      gRoute.append('path').attr('class','hit').attr('d',dstr).on('mousemove',ev=>tipHtml(ev)).on('mouseleave',hideTip);
    }
  });
  document.querySelectorAll('tr.row').forEach(r=>r.classList.toggle('on',r.dataset.id===hoverDest));
}

// ---------- label placement with collision avoidance ----------
const LH=14, wcache=new Map();
function tw(txt,cls){
  const key=cls+'|'+txt;
  let w=wcache.get(key);
  if(w==null){
    const el=gLab.append('text').attr('class','lbl '+cls).text(txt).node();
    w=el.getComputedTextLength?el.getComputedTextLength():txt.length*6.5;
    el.remove();
    if(!w) w=txt.length*6.5;
    wcache.set(key,w);
  }
  return w;
}
const hit=(a,b)=>a[0]<b[2]+2&&a[2]+2>b[0]&&a[1]<b[3]+2&&a[3]+2>b[1];
function place(){
  const k=T.k, kH=HOME_T.k;
  const boxes=[];
  const vis=m=>layers[m.kind];
  // marker footprints are obstacles
  mk.forEach(m=>{
    const [x,y]=T.apply(m.xy);
    m.sx=x;m.sy=y;
    m.g.attr('transform',`translate(${x},${y})`).style('display',vis(m)?null:'none');
    m.g.classed('dim',m.kind==='factory'&&m.o.id!==sel);
    if(vis(m)) boxes.push([x-8,y-8,x+8,y+8]);
  });
  const inView=b=>b[0]>=2&&b[2]<=W-2&&b[1]>=2&&b[3]<=H-2;
  const order=['factory','market','border','port'];
  order.forEach(kind=>{
    mk.filter(m=>m.kind===kind).forEach(m=>{
      if(!vis(m)){m.t.style('display','none');return;}
      let allowed=true;
      if(kind==='port') allowed=(k>=kH*2.0)||m.o.id===hoverDest;
      if(m.o.id===hoverDest) allowed=true;
      const w=tw(m.o.short||m.o.n,'');
      const x=m.sx,y=m.sy;
      // candidates: [x0,y0(top),anchorX]
      const right=[x+10,y-9], left=[x-10-w,y-9], above=[x-w/2,y-9-LH-2], below=[x-w/2,y+9];
      let cands=[right,left,above,below];
      if(kind==='port') cands=[left,right,below,above];
      if(kind==='factory'&&Number.isFinite(m.o.dx)&&Number.isFinite(m.o.dy)){
        const a=m.o.anchor||'start';
        const first=[a==='end'?x+m.o.dx-w:a==='middle'?x+m.o.dx-w/2:x+m.o.dx, y+m.o.dy-11];
        cands=[first,...cands];
      }
      let chosen=null;
      if(allowed){
        for(const c of cands){
          const b=[c[0],c[1],c[0]+w,c[1]+LH];
          if(!inView(b)) continue;
          if(boxes.some(o=>hit(b,o))) continue;
          chosen={c,b};break;
        }
        if(!chosen&&kind==='factory'){const c=cands[0];chosen={c,b:[c[0],c[1],c[0]+w,c[1]+LH]};}
      }
      if(chosen){
        boxes.push(chosen.b);
        m.t.attr('x',chosen.c[0]).attr('y',chosen.c[1]+11).attr('text-anchor','start').style('display',null);
      } else m.t.style('display','none');
    });
  });
  // geo labels: lowest priority
  GL.forEach(g=>{
    const [x,y]=T.apply(g.xy);
    let show=!(g.cls==='geo'&&k>kH*3.5);
    if(show){
      const w=tw(g.t,g.cls)+2;
      const b=[x-w/2,y-9,x+w/2,y+5];
      if(!inView(b)||boxes.some(o=>hit(b,o))) show=false; else boxes.push(b);
    }
    g.el.attr('x',x).attr('y',y).style('display',show?null:'none');
  });
}

// ---------- zoom ----------
const zoom=d3.zoom().scaleExtent([1,16]).translateExtent([[-60,-60],[W+60,H+60]]).on('zoom',ev=>{T=ev.transform;gGeo.attr('transform',T);place();});
svg.call(zoom).on('dblclick.zoom',null);
const bboxT=(lo0,la0,lo1,la1)=>{
  const a=proj([lo0,la1]), b=proj([lo1,la0]);
  const k=Math.max(1,Math.min(16,0.92*Math.min(W/(b[0]-a[0]),H/(b[1]-a[1]))));
  return d3.zoomIdentity.translate(W/2-k*(a[0]+b[0])/2,H/2-k*(a[1]+b[1])/2).scale(k);
};
const HOME_T=bboxT(...META.home);
const go=t=>svg.transition().duration(550).call(zoom.transform,t);
document.getElementById('z-in').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById('z-out').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
(function(){
  const zb=document.getElementById('zoombar');
  const add=(id,label,fn)=>{const b=document.createElement('button');b.className='btn wide';b.id=id;b.textContent=label;b.onclick=fn;zb.appendChild(b);};
  add('z-home','نمای کلی',()=>go(HOME_T));
  (META.presets||[]).forEach((p,i)=>add('z-p'+i,p[0],()=>go(bboxT(...p[1]))));
})();

['factory','port','border','market'].forEach(k=>{
  const b=document.getElementById('t-'+k);
  b.onclick=()=>{layers[k]=!layers[k];b.setAttribute('aria-pressed',layers[k]);render();};
});

// ---------- panel ----------
function modeOf(k){
  if(k<=60) return 'جاده (کوتاه)';
  if(k<=400) return 'جاده';
  if(k<=700) return 'جاده یا ریل';
  return 'ریل (پیشنهادی)';
}
const panel=document.getElementById('panel');
function groupRows(type){
  const list=D.filter(d=>d.t===type).map(d=>({d,m:dist[sel][d.id]})).sort((a,b)=>a.m-b.m);
  const rows=list.map(({d,m})=>`<tr class="row" tabindex="0" data-id="${d.id}"><td>${d.n}${d.role&&type!=='port'?`<div class="mode">${d.role}</div>`:''}</td><td class="n">${fa(km(m))}</td><td class="mode">${modeOf(km(m))}</td></tr>`).join('');
  return `<div class="grp"><span class="sw ${TYPE[type].cls}"></span>${TYPE[type].grp}</div>
  <table><thead><tr><th>مقصد</th><th class="n">کیلومتر</th><th>حالت پیشنهادی</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderPanel(){
  const f=Fid[sel];
  const others=F.map(x=>`<button class="fbtn${x.id===sel?' on':''}" data-f="${x.id}"><span>${x.name}</span><small>${x.co}</small></button>`).join('');
  panel.innerHTML=`
    <div class="fl" style="margin-top:0">${others}</div>
    <h2 style="margin-top:14px">${f.name}</h2>
    <p class="co">${f.co} · ${f.loc}</p>
    <dl class="facts">
      <dt>ظرفیت بی‌کربنات</dt><dd>${f.cap}<span class="q">اعتبار: ${f.capq}</span></dd>
      <dt>گریدها</dt><dd>${f.grades}</dd>
      <dt>مختصات</dt><dd>${f.coord}</dd>
      <dt>توضیح</dt><dd>${f.note}</dd>
    </dl>
    ${['port','border','market'].filter(t=>layers[t]).map(groupRows).join('')}
    <div class="note">${META.panelNote||'حالت پیشنهادی بر پایه‌ی طول مسیر و به‌صورت قاعده‌ی تقریبی است؛ فاصله‌ی ریلی هنوز اندازه‌گیری نشده است. خط‌چین‌ها مسیر شماتیک‌اند و خط ممتد مسیر واقعی جاده را نشان می‌دهد.'}</div>`;
  panel.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{sel=b.dataset.f;render();});
  panel.querySelectorAll('tr.row').forEach(r=>{
    r.onmouseenter=()=>{hoverDest=r.dataset.id;drawRoutes();place();};
    r.onmouseleave=()=>{hoverDest=null;drawRoutes();place();};
    r.onfocus=r.onmouseenter; r.onblur=r.onmouseleave;
  });
}
function render(){renderPanel();drawRoutes();place();}

// ---------- matrix ----------
(function(){
  const head=`<thead><tr><th>مقصد</th>${F.map(f=>`<th class="n">${f.short}</th>`).join('')}</tr></thead>`;
  let body='';
  ['port','border','market'].forEach(t=>{
    body+=`<tr><th colspan="${F.length+1}" style="background:var(--chip);color:var(--ink)">${TYPE[t].grp}</th></tr>`;
    D.filter(d=>d.t===t).forEach(d=>{
      const vals=F.map(f=>dist[f.id][d.id]);
      const min=Math.min(...vals);
      body+=`<tr><td>${d.n}</td>${F.map((f,i)=>`<td class="n" ${vals[i]===min?'style="font-weight:700"':''}>${fa(km(vals[i]))}</td>`).join('')}</tr>`;
    });
  });
  document.getElementById('matrix').innerHTML=head+'<tbody>'+body+'</tbody>';
})();

svg.call(zoom.transform,HOME_T);
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{wcache.clear();place();});
</script>
</body></html>
